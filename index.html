<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>300大作战 · 补丁下载中心</title>
<link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
<style>
  :root {
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent-soft: #eef3fc;
    --accent-border: #c3d5f2;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #2b3440;
    --muted: #7c8698;
    --border: #e3e7ee;
    --shadow: 0 1px 4px rgba(15, 30, 60, 0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--text); line-height: 1.6; background: var(--bg);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* 纯色背景 */
  .bg, .bg-veil { position: fixed; inset: 0; z-index: -2; background: #f4f5f7; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 56px;
    background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar .brand { display: flex; align-items: center; gap: 10px; }
  .topbar .brand img { height: 30px; width: auto; }
  .topbar .brand .name { font-weight: 700; font-size: 15px; }
  .topbar .nav { display: flex; gap: 20px; font-size: 14px; color: var(--muted); }
  .topbar .nav a:hover { color: var(--accent); }

  /* ---------- 主区域（全宽） ---------- */
  .main { padding: 20px; }

  /* 面包屑 */
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .crumb .back { cursor: pointer; color: var(--accent); font-weight: 600; }
  .crumb .back:hover { text-decoration: underline; }
  .crumb .sep { color: #c4c9d6; }
  .crumb .cur { color: var(--text); font-weight: 700; }
  .cnt-toggle { margin-left: auto; background: var(--card); border: 1px solid var(--border); color: var(--accent); font-size: 12px; padding: 5px 11px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .cnt-toggle:hover { background: #f2f5fb; }
  .cnt-toggle:disabled { opacity: .6; cursor: default; }

  /* 首页标题行 */
  .home-head { margin-bottom: 16px; }
  .home-head h1 { font-size: 22px; font-weight: 800; }
  .home-head h1 .grad { color: var(--text); }
  .home-head .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .home-head .announce { margin-top: 8px; display: inline-block; padding: 5px 14px; background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: 8px; font-size: 13px; color: var(--accent-dark); }

  /* 统计行 */
  .stat-line { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-line .pill { padding: 5px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--muted); }
  .stat-line .pill b { color: var(--accent); font-weight: 700; }

  /* ---------- 分类网格（首页） ---------- */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .cat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 18px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s;
    display: flex; align-items: center; gap: 14px;
  }
  .cat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(30,40,80,.1); border-color: var(--accent-border); }
  .cat-card .ic { width: 46px; height: 46px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
    background: var(--accent-soft); }
  .cat-card .info { min-width: 0; }
  .cat-card .info .n { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-card .info .m { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---------- 文件列表（分类页） ---------- */
  .file-table { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .file-head, .file-row {
    display: grid; grid-template-columns: 1fr 88px 150px 92px; align-items: center; gap: 10px;
    padding: 12px 18px;
  }
  .file-head { background: #f2f5fb; font-size: 12px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); }
  .file-row { border-top: 1px solid var(--border); cursor: pointer; transition: background .12s; }
  .file-row:first-of-type { border-top: none; }
  .file-row:hover { background: #f6f8fb; }
  .file-row.open { background: #eef4fd; }
  .file-row .name { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .file-row .ext { width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; background: var(--accent); letter-spacing: .5px; }
  .file-row .name .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .name .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 5px; vertical-align: middle; margin-left: 4px; }
  .src-tag.mine { background: #e6f7ed; color: #1a8a4a; }
  .src-tag.mirror { background: #f0f2f6; color: #8a9099; }
  .src-tag.auto { background: #fff4e0; color: #b8860b; }
  .meta-line { display: flex; flex-direction: column; gap: 2px; }
  .dl-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dl-count b { color: var(--accent); font-weight: 700; }
  /* 同步状态条 */
  .sync-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
    margin-bottom: 14px; padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  .sync-bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .sync-bar.loading .dot { background: #d29922; animation: pulse 1s infinite; }
  .sync-bar.ok .dot { background: #1a8a4a; }
  .sync-bar.err .dot { background: #d64545; }
  .sync-bar .refresh { margin-left: auto; color: var(--accent); cursor: pointer; font-weight: 600; flex-shrink: 0; }
  .sync-bar .refresh:hover { text-decoration: underline; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .file-row .cell { font-size: 13px; color: var(--muted); }
  .btn { display: inline-block; padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: box-shadow .15s; }
  .btn.dl { background: var(--accent); color: #fff; text-align: center; box-shadow: 0 2px 8px rgba(37,99,235,.25); }
  .btn.dl:hover { box-shadow: 0 4px 12px rgba(37,99,235,.4); }

  /* 展开的更新内容 */
  .file-detail { display: none; padding: 4px 18px 14px 70px; border-top: 1px dashed var(--border); background: #fbfcff; }
  .file-row.open + .file-detail { display: block; }
  .file-detail .t { font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  .file-detail ul { list-style: none; }
  .file-detail li { font-size: 13px; padding: 2px 0; padding-left: 16px; position: relative; color: #5a5e72; }
  .file-detail li::before { content: "▪"; position: absolute; left: 0; color: var(--accent); font-size: 10px; }

  /* ---------- 指南 ---------- */
  .guide { margin-top: 26px; }
  .guide h2 { font-size: 17px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .guide h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .guide .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .guide .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .guide .card h3 { font-size: 14px; margin-bottom: 6px; color: var(--accent); }
  .guide .card p { font-size: 13px; color: var(--muted); }
  .guide .card .steps { margin-top: 8px; list-style: none; counter-reset: s; }
  .guide .card .steps li { font-size: 13px; padding: 2px 0; counter-increment: s; }
  .guide .card .steps li::before { content: counter(s) ". "; color: var(--accent); font-weight: 700; }

  footer { padding: 22px 20px 40px; text-align: center; color: var(--muted); font-size: 12px; }
  footer .disc { max-width: 640px; margin: 0 auto 8px; opacity: .7; }

  /* ---------- 移动端 ---------- */
  @media (max-width: 640px) {
    .main { padding: 14px; }
    .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .cat-card { padding: 14px 12px; flex-direction: column; align-items: flex-start; gap: 8px; }
    .file-head { display: none; }
    .file-row { grid-template-columns: 1fr auto; grid-template-areas: "name dl" "meta meta"; padding: 12px 14px; }
    .file-row .name { grid-area: name; }
    .file-row .cell.size { display: none; }
    .file-row .meta-line { grid-area: meta; flex-direction: row; gap: 14px; font-size: 12px; padding-left: 52px; }
    .file-row .dl { grid-area: dl; }
    .file-detail { padding-left: 14px; }
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div class="bg-veil"></div>

<header class="topbar">
  <div class="brand">
    <div class="name">300大作战 · 补丁下载</div>
  </div>
  <div class="nav">
    <a href="#/">首页</a>
    <a href="#guide">更新指南</a>
  </div>
</header>

<main class="main">
  <!-- 首页：分类 -->
  <div id="view-home">
    <div class="home-head">
      <h1><span class="grad" id="site-title">补丁下载中心</span></h1>
      <div class="sub" id="site-subtitle"></div>
      <div class="announce" id="site-announce"></div>
    </div>
    <div class="sync-bar loading" id="sync-bar"><span class="dot"></span><span id="sync-text">正在从仓库同步最新补丁列表…</span><span class="refresh" id="sync-refresh">刷新</span></div>
    <div class="stat-line" id="stat-line"></div>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="guide" id="guide"></div>
  </div>

  <!-- 分类页：文件列表 -->
  <div id="view-cat" style="display:none;">
    <div class="crumb">
      <span class="back" id="crumb-back">← 返回</span>
      <span class="sep">/</span>
      <span>首页</span>
      <span class="sep">/</span>
      <span class="cur" id="crumb-cur"></span>
      <button class="cnt-toggle" id="viewCountsBtn" type="button">📊 查看下载次数</button>
    </div>
    <div class="file-table" id="file-table"></div>
  </div>
</main>

<footer>
  <p class="disc" id="footer-disc"></p>
  <p>300大作战 · 补丁下载中心</p>
</footer>

<script src="config.js"></script>
<script src="patches.js"></script>
<script>
  const TYPE_LABEL = { client: "客户端", resource: "资源", hotfix: "热修复" };

  const S = (typeof SITE !== "undefined") ? SITE : {};
  const staticData = (typeof PATCHES !== "undefined" ? PATCHES : []);
  let patchData = staticData.slice(); // 渲染用数据，会被仓库实时数据替换/合并

  // 仓库配置（从 config.js 读取，可改）
  const REPO = S.repo || { owner: "LvShu2009", name: "patch-download", branch: "main", dir: "patches" };
  const RAW_BASE = `https://raw.githubusercontent.com/${REPO.owner}/${REPO.name}/${REPO.branch}/`;

  /* ---------- Gitee 下载镜像（优先）----------
     列表仍从 GitHub 读取；但下载时优先走 Gitee（国内快），失败自动回退 GitHub。
     Gitee 免费版单仓 500MB，补丁按分类拆到 4 个仓库；这里维护「分类 → 仓库」映射。
     鱼玖的补丁被拆成两处：90MB 的大文件在 300m-patches，其余在 300m-patches-4。 */
  const GITEE = S.gitee || {
    enabled: true,
    owner: "happy-every-day-in-the-book",
    branch: "master",
    repos: ["300m-patches", "300m-patches-2", "300m-patches-3", "300m-patches-4"],
    // 分类 → 仓库索引（对应 GITEE.repos 的下标）
    catRepo: {
      "兴欣的君莫笑补丁": 0, "秋月的补丁": 0,
      "LuCy的补丁": 1, "夜尔的补丁": 1, "小明的补丁": 1,
      "ACNZ的补丁": 2, "Zn的补丁": 2, "mikufan的补丁": 2,
      "鱼玖的补丁": 3
    },
    // 特例：这些文件（含 90MB 大包）实际在 0 号仓库
    fileOverride: { "蔚蓝档案主题懒人包.zip": 0 }
  };
  // 由 GitHub 仓库路径推出对应的 Gitee raw 直链；无映射则返回空
  function giteeUrlFor(p) {
    if (!GITEE.enabled) return "";
    let cat = p.category || "";
    const fileName = fileNameOf(p.url || "");
    let idx = (GITEE.fileOverride && GITEE.fileOverride[fileName] != null)
      ? GITEE.fileOverride[fileName]
      : GITEE.catRepo[cat];
    if (idx == null || !GITEE.repos[idx]) return "";
    // GitHub 路径形如 patches/分类/文件；Gitee 仓库里是 分类/文件（去掉 patches 前缀）
    let rel = String(p.url || "");
    const marker = "/main/";
    const mi = rel.indexOf(marker);
    if (mi >= 0) rel = rel.slice(mi + marker.length);
    rel = rel.replace(/^[^/]+\//, ""); // 去掉最外层目录（patches/）
    const enc = rel.split("/").map(encodeURIComponent).join("/");
    return `https://raw.giteeusercontent.com/${GITEE.owner}/${GITEE.repos[idx]}/raw/${GITEE.branch}/${enc}`;
  }
  // 探测结果缓存：key=giteeUrl -> true(可用)/false(不可用)
  const GITEE_PROBE_KEY = "patchdl_gitee_probe_v1";
  let giteeProbe = {};
  try { giteeProbe = JSON.parse(localStorage.getItem(GITEE_PROBE_KEY) || "{}"); } catch (e) { giteeProbe = {}; }
  function saveGiteeProbe() { try { localStorage.setItem(GITEE_PROBE_KEY, JSON.stringify(giteeProbe)); } catch (e) {} }
  // 快速探测 Gitee 直链是否可用（只取 1 字节；超时视为不可用）
  function probeGitee(url) {
    if (!url) return Promise.resolve(false);
    if (giteeProbe[url] === true) return Promise.resolve(true);
    if (giteeProbe[url] === false) return Promise.resolve(false);
    return new Promise(resolve => {
      const ctl = ("AbortController" in window) ? new AbortController() : null;
      const timer = setTimeout(() => { if (ctl) ctl.abort(); resolve(false); }, 3500);
      fetch(url, Object.assign({ method: "GET", headers: { Range: "bytes=0-0" }, cache: "no-store" }, ctl ? { signal: ctl.signal } : {}))
        .then(r => { clearTimeout(timer); const ok = r.ok || r.status === 206; giteeProbe[url] = ok; saveGiteeProbe(); resolve(ok); })
        .catch(() => { clearTimeout(timer); giteeProbe[url] = false; saveGiteeProbe(); resolve(false); });
    });
  }

  /* ---------- 下载次数统计（Abacus / Cloudflare）---------- */
  const COUNTER = S.counter || { enabled: false };
  const COUNT_CACHE_KEY = "patchdl_counts_v1";
  let countCache = {};
  try { countCache = JSON.parse(localStorage.getItem(COUNT_CACHE_KEY) || "{}"); } catch (e) { countCache = {}; }
  function counterKey(p) {
    // Abacus 的 key 只允许 [A-Za-z0-9_\\-.]{3,64}，中文文件名不合法
    // 用稳定的字符串哈希（FNV-1a 变体）把任意文件名映射成合法 key，保证同一补丁 key 不变
    const fn = fileNameOf(p.url || "");
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < fn.length; i++) {
      const c = fn.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 + c + i, 0x85ebca6b) >>> 0;
    }
    return "p" + h1.toString(36) + h2.toString(36); // 纯字母数字，长度合规
  }
  function saveCountCache() {
    try { localStorage.setItem(COUNT_CACHE_KEY, JSON.stringify(countCache)); } catch (e) {}
  }
  // 本机缓存里有就显示数字，否则显示占位（打开页面不发任何请求）
  function cachedCount(p) {
    const key = counterKey(p);
    const c = countCache[key];
    return (c && typeof c.n === "number") ? c.n : "—";
  }
  // 读取计数（只读，不 +1）；Abacus 的 /get 对不存在的 key 返回 404 → 视为 0
  async function fetchCount(p) {
    if (!COUNTER.enabled || !COUNTER.base) return 0;
    const key = counterKey(p);
    try {
      const url = `${COUNTER.base}/get/${encodeURIComponent(COUNTER.namespace || "patchdl")}/${encodeURIComponent(key)}`;
      const res = await fetch(url, { cache: "no-store" });
      if (res.status === 404) return 0;
      if (!res.ok) return 0;
      const j = await res.json();
      return (typeof j.value === "number") ? j.value : 0;
    } catch (e) { return 0; }
  }
  // 点击下载时 +1（命中即计数，失败不影响下载）
  function hitCount(p) {
    if (!COUNTER.enabled || !COUNTER.base) return;
    const key = counterKey(p);
    try {
      const url = `${COUNTER.base}/hit/${encodeURIComponent(COUNTER.namespace || "patchdl")}/${encodeURIComponent(key)}`;
      fetch(url, { mode: "cors", keepalive: true })
        .then(res => res.ok ? res.json() : null)
        .then(j => {
          if (j && typeof j.value === "number") {
            countCache[key] = { n: j.value, t: Date.now() };
            saveCountCache();
            document.querySelectorAll(`[data-cnt-key="${CSS.escape(key)}"]`).forEach(el => { el.textContent = j.value; });
          }
        })
        .catch(() => {});
    } catch (e) {}
  }
  // 「查看下载次数」按钮：手动触发，逐个读取当前分类的补丁次数（限速，避免 429）
  async function viewCounts() {
    if (!COUNTER.enabled || !COUNTER.base) return;
    const btn = document.getElementById("viewCountsBtn");
    const els = Array.from(document.querySelectorAll("#file-table .cnt-val"));
    if (!els.length) return;
    if (btn) { btn.disabled = true; btn.textContent = "读取中…"; }
    for (const el of els) {
      const key = el.getAttribute("data-cnt-key");
      const p = patchData.find(x => counterKey(x) === key);
      if (!p) continue;
      const n = await fetchCount(p);
      el.textContent = n;
      countCache[key] = { n: n, t: Date.now() };
      saveCountCache();
      await new Promise(r => setTimeout(r, 360));
    }
    if (btn) { btn.disabled = false; btn.textContent = "📊 刷新下载次数"; }
  }

  // 站点信息
  document.title = S.title || document.title;
  document.getElementById("site-subtitle").textContent = S.subtitle || "";
  const ann = document.getElementById("site-announce");
  if (S.announcement) { ann.textContent = S.announcement; ann.style.display = "inline-block"; }
  else { ann.style.display = "none"; }
  const fd = document.getElementById("footer-disc");
  if (fd && S.footer) fd.textContent = S.footer;
  if (S.show_guide === false) document.getElementById("guide").style.display = "none";

  // 文件指纹：从 URL / 路径里取文件名，用于把仓库文件和静态清单匹配
  function fileNameOf(str) {
    try { return decodeURIComponent(String(str).split("/").pop().split("?")[0]); }
    catch (e) { return String(str).split("/").pop().split("?")[0]; }
  }
  function escAttr(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtBytes(n) {
    if (!n && n !== 0) return "";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }

  // 从 GitHub 仓库实时读取文件，与静态清单合并后重新渲染
  async function syncFromRepo() {
    const bar = document.getElementById("sync-bar");
    const txt = document.getElementById("sync-text");
    bar.className = "sync-bar loading"; txt.textContent = "正在从仓库同步最新补丁列表…";
    try {
      const treeUrl = `https://api.github.com/repos/${REPO.owner}/${REPO.name}/git/trees/${encodeURIComponent(REPO.branch)}?recursive=1`;
      const res = await fetch(treeUrl, { headers: { "Accept": "application/vnd.github+json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (data.truncated) throw new Error("仓库文件过多，列表被截断");

      const dir = (REPO.dir || "").replace(/^\/+|\/+$/g, "");
      // 描述文件位置（可用 config.js 的 repo.meta 覆盖，默认 dir/meta.json）
      const metaFile = (REPO.meta || (dir ? dir + "/meta.json" : "meta.json"));
      // 先把描述文件读进来（读取失败不影响主流程，按默认描述显示）
      let metaMap = {};
      let metaSource = "";
      const encMeta = metaFile.split("/").map(encodeURIComponent).join("/");
      // 方式1：优先用 GitHub API 读（国内网络通常比 raw 稳，返回 base64 内容）
      try {
        const apiUrl = `https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/${encMeta}` +
          `?ref=${encodeURIComponent(REPO.branch)}&t=${Date.now()}`;
        const ar = await fetch(apiUrl, { headers: { "Accept": "application/vnd.github+json" }, cache: "no-store" });
        if (ar.ok) {
          const aj = await ar.json();
          if (aj && aj.content) {
            // base64 → UTF-8（中文安全）
            const bin = atob(String(aj.content).replace(/\s/g, ""));
            const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
            const txt = new TextDecoder().decode(bytes);
            const mj = JSON.parse(txt);
            if (mj && typeof mj === "object" && !Array.isArray(mj)) { metaMap = mj; metaSource = "api"; }
          }
        }
      } catch (e) {}
      // 方式2：API 失败再退回 raw
      if (!Object.keys(metaMap).length) {
        try {
          const mr = await fetch(RAW_BASE + encMeta + "?t=" + Date.now(), { cache: "no-store" });
          if (mr.ok) {
            const mj = await mr.json();
            if (mj && typeof mj === "object" && !Array.isArray(mj)) { metaMap = mj; metaSource = "raw"; }
          }
        } catch (e) {}
      }
      // 按「完整路径」或「文件名」两种 key 查描述（兼容上传工具与手动填写）
      function descFor(path, fileName) {
        return metaMap[path] || metaMap[fileName] || null;
      }
      function applyDesc(obj, desc) {
        if (!desc) return obj;
        if (desc.title) obj.title = desc.title;
        if (desc.summary) obj.summary = desc.summary;
        if (desc.changes && desc.changes.length) obj.changes = desc.changes;
        if (desc.date) obj.date = desc.date;
        if (desc.category) obj.category = desc.category;
        return obj;
      }

      // 仓库里的补丁文件：path 形如 patches/分类/文件名 或 patches/文件名
      const blobs = (data.tree || []).filter(x => x.type === "blob" &&
        x.path.startsWith(dir ? dir + "/" : "") &&
        x.path !== metaFile && x.path.toLowerCase() !== "readme.md" &&
        !x.path.toLowerCase().endsWith("/meta.json"));

      // 用文件名建立静态清单索引（含标题/简介/日期/更新内容）
      const staticByName = {};
      staticData.forEach(p => { staticByName[fileNameOf(p.url)] = p; });

      const merged = [];
      blobs.forEach(b => {
        const parts = b.path.split("/");
        let category, fn;
        if (dir) {
          const rest = parts.slice(1); // 去掉 patches
          if (rest.length >= 2) { category = rest[0]; fn = rest.slice(1).join("/"); }
          else { category = "未分类"; fn = rest[0]; } // patches 根目录文件
        } else {
          category = parts.length >= 2 ? parts[0] : "未分类";
          fn = parts.length >= 2 ? parts.slice(1).join("/") : parts[0];
        }
        const fileName = fileNameOf(fn);
        const meta = staticByName[fileName];
        const desc = descFor(b.path, fileName);
        const encPath = b.path.split("/").map(encodeURIComponent).join("/");
        const raw = RAW_BASE + encPath;
        if (meta) {
          // 静态清单里有：保留介绍信息，链接换成自己的 raw 源；meta.json 里的描述优先覆盖
          const item = Object.assign({}, meta, { category: category, url: raw, source: "github", _auto: true });
          merged.push(applyDesc(item, desc));
        } else {
          // 仓库里新加、清单里没有：自动生成条目（有 meta 描述就用它，否则用默认）
          const item = {
            title: fileName,
            summary: "仓库新增补丁",
            size: fmtBytes(b.size),
            date: new Date().toISOString().slice(0, 10),
            url: raw,
            source: "github",
            changes: ["新增补丁文件"],
            category: category,
            _auto: true, _new: true
          };
          merged.push(applyDesc(item, desc));
        }
      });

      // 静态清单里是镜像源（仓库中不存在）的条目仍保留，保证失效的那个还能显示
      const repoNames = new Set(blobs.map(b => fileNameOf(b.path)));
      staticData.forEach(p => {
        if (p.source !== "github" && !repoNames.has(fileNameOf(p.url))) {
          const desc = descFor(fileNameOf(p.url), fileNameOf(p.url));
          merged.push(applyDesc(Object.assign({}, p), desc));
        }
      });

      patchData = merged;
      const newCount = merged.filter(p => p._new).length;
      const descCount = Object.keys(metaMap).length;
      route(); // 用新数据重新渲染当前视图
      bar.className = "sync-bar ok";
      txt.textContent = "已同步仓库：共 " + merged.length + " 个补丁" +
        (newCount ? "（含 " + newCount + " 个新增）" : "") +
        (descCount
          ? " · 描述已同步（" + descCount + " 条自定义" + (metaSource ? "，来源 " + metaSource : "") + "）"
          : " · 未读到自定义描述（检查 patches/meta.json 是否可访问）") +
        " · 自动更新已开启";
    } catch (e) {
      bar.className = "sync-bar err";
      txt.textContent = "同步失败（" + e.message + "），显示本地清单";
    }
  }

  function byCat() {
    const g = {};
    patchData.forEach(p => { const c = p.category || "未分类"; (g[c] = g[c] || []).push(p); });
    return g;
  }

  function renderHome() {
    const groups = byCat();
    const cats = Object.keys(groups);
    // 统计
    const sl = document.getElementById("stat-line");
    sl.innerHTML = `<span class="pill">共 <b>${cats.length}</b> 个分类</span><span class="pill">共 <b>${patchData.length}</b> 个补丁</span>`;
    // 分类卡片
    const grid = document.getElementById("cat-grid");
    grid.innerHTML = "";
    cats.forEach(c => {
      const list = groups[c];
      const card = document.createElement("div");
      card.className = "cat-card";
      card.innerHTML = `
        <div class="ic">📁</div>
        <div class="info"><div class="n">${c}</div><div class="m">${list.length} 个补丁</div></div>`;
      card.addEventListener("click", () => { location.hash = "#/cat/" + encodeURIComponent(c); });
      grid.appendChild(card);
    });
    // 指南
    renderGuide();
  }

  function renderGuide() {
    const ge = document.getElementById("guide");
    if (S.show_guide === false) return;
    const cards = (S.guide || []).map(g => `
      <div class="card">
        <h3>${g.title}</h3>
        <p>${g.desc}</p>
        <ol class="steps">${(g.steps || []).map(s => `<li>${s}</li>`).join("")}</ol>
      </div>`).join("");
    ge.innerHTML = `<h2><span class="dot"></span>更新指南</h2><div class="grid">${cards}</div>`;
  }

  function renderCat(cat) {
    const list = byCat()[cat] || [];
    list.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    document.getElementById("crumb-cur").textContent = cat;
    const tbl = document.getElementById("file-table");
    tbl.innerHTML = `<div class="file-head"><span>名称</span><span>大小</span><span>更新 / 下载</span><span>下载</span></div>`;
    list.forEach(p => {
      const ext = (p.url.split(".").pop() || "zip").toUpperCase().slice(0, 4);
      const isGithub = p.source === "github";
      const srcTag = p._new
        ? `<span class="src-tag auto">新增</span>`
        : (isGithub ? `<span class="src-tag mine">本地源</span>` : `<span class="src-tag mirror">镜像源</span>`);
      const row = document.createElement("div");
      row.className = "file-row";
      row.innerHTML = `
        <div class="name">
          <span class="ext">${ext}</span>
          <div style="min-width:0;">
            <div class="t">${p.title} ${srcTag}</div>
            <div class="s">${p.summary}</div>
          </div>
        </div>
        <span class="cell size">${p.size}</span>
        <span class="meta-line">
          <span class="cell date">${p.date}</span>
          <span class="cell dl-count">${COUNTER.enabled ? `<b data-cnt-key="${escAttr(counterKey(p))}" class="cnt-val">${cachedCount(p)}</b> 次` : `—`}</span>
        </span>
        <span class="dl"><a class="btn dl" href="${escAttr(p.url)}" download data-gitee="${escAttr(giteeUrlFor(p))}">下载</a></span>`;
      // 不主动发请求：次数只显示本机缓存，点「查看下载次数」或下载后才更新
      // 点下载：优先 Gitee（国内快），失败回退 GitHub；并 +1 计数
      const dlBtn = row.querySelector("a.btn.dl");
      if (dlBtn) dlBtn.addEventListener("click", e => {
        e.preventDefault(); e.stopPropagation();
        hitCount(p);
        const giteeUrl = dlBtn.getAttribute("data-gitee");
        if (giteeUrl) {
          dlBtn.textContent = "检测中…";
          probeGitee(giteeUrl).then(ok => {
            dlBtn.textContent = "下载";
            if (ok) { window.location.href = giteeUrl; }
            else { window.location.href = p.url; }
          });
        } else {
          window.location.href = p.url;
        }
      });
      const detail = document.createElement("div");
      detail.className = "file-detail";
      detail.innerHTML = `<div class="t">更新内容</div><ul>${p.changes.map(c => `<li>${c}</li>`).join("")}</ul>`;
      row.addEventListener("click", () => { row.classList.toggle("open"); });
      tbl.appendChild(row);
      tbl.appendChild(detail);
    });
    if (!list.length) tbl.innerHTML += `<div style="padding:24px;text-align:center;color:var(--muted);">该分类下暂无补丁</div>`;
  }

  function route() {
    const h = location.hash.slice(1) || "/";
    if (h.startsWith("/cat/")) {
      document.getElementById("view-home").style.display = "none";
      document.getElementById("view-cat").style.display = "block";
      renderCat(decodeURIComponent(h.slice(5)));
      window.scrollTo(0, 0);
    } else {
      document.getElementById("view-home").style.display = "block";
      document.getElementById("view-cat").style.display = "none";
      renderHome();
    }
  }

  document.getElementById("crumb-back").addEventListener("click", () => { location.hash = "#/"; });
  document.getElementById("viewCountsBtn").addEventListener("click", viewCounts);
  document.getElementById("sync-refresh").addEventListener("click", syncFromRepo);
  window.addEventListener("hashchange", route);
  route();
  // 页面加载后自动从仓库同步（失败时保留本地清单，不影响使用）
  syncFromRepo();
</script>
</body>
</html>
